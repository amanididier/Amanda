name: Windows installer # Build the latest workspace chat changes

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to publish, for example v0.1.2. Leave blank for a normal CI installer."
        required: false
        type: string
  push:
    branches:
      - main
      - "v0/local-model-first-run"
      - "ui/**"
      - "fix/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust source
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Install dependencies
        run: bun install

      - name: Format changed frontend files
        shell: pwsh
        run: |
          bun x prettier --write src/components/app-shell.tsx src/components/update-notice.tsx src/components/local-research-library.tsx src/components/local-workspace-chat.tsx src/components/temporary-chat.tsx src/routes/_authenticated/_shell.index.tsx 'src/routes/_authenticated/_shell.w.$workspaceId.tsx' src/routes/_authenticated/_shell.notes.tsx src/routes/_authenticated/_shell.settings.tsx src/lib/pending-workspace-prompt.ts src/lib/context.ts src/lib/local-attachments.ts src/test/local-attachments.test.ts src/styles.css

      - name: Check frontend lint
        run: bun run lint

      - name: Check frontend types
        run: bun x tsc --noEmit -p tsconfig.json

      - name: Run frontend tests
        run: bun run test

      - name: Validate release version
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $expected = "v$($config.version)"
          $requested = if ("${{ inputs.release_tag }}") { "${{ inputs.release_tag }}" } else { "${{ github.ref_name }}" }
          if ($requested -ne $expected) {
            throw "Release tag $requested does not match app version $expected. Update tauri.conf.json first."
          }

      - name: Build NSIS installer (non-release builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.release_tag == '' }}
        run: bun run desktop:build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.release_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Amanda-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Build, sign, and publish updater release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseCommitish: ${{ github.sha }}
          releaseName: Amanda ${{ inputs.release_tag || github.ref_name }}
          releaseBody: "Amanda update release. Download the installer below or update directly from the app."
          args: --bundles nsis
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseDraft: false
          prerelease: false
