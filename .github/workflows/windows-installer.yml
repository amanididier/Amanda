name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - "v0/local-model-first-run"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend lint
        run: bun run lint

      - name: Check frontend types
        run: bun x tsc --noEmit -p tsconfig.json

      - name: Run frontend tests
        run: bun run test

      - name: Build NSIS installer
        run: bun run desktop:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amanda-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
