name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - "v0/local-model-first-run"
      - "ui/**"
      - "fix/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust source
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed frontend files
        run: >-
          bun x prettier --write
          src/components/app-shell.tsx
          src/components/local-research-library.tsx
          src/components/local-workspace-chat.tsx
          src/components/temporary-chat.tsx
          src/routes/_authenticated/_shell.index.tsx
          src/routes/_authenticated/_shell.w.$workspaceId.tsx
          src/routes/_authenticated/_shell.notes.tsx
          src/routes/_authenticated/_shell.settings.tsx
          src/lib/pending-workspace-prompt.ts
          src/styles.css

      - name: Check frontend lint
        run: bun run lint

      - name: Check frontend types
        run: bun x tsc --noEmit -p tsconfig.json

      - name: Run frontend tests
        run: bun run test

      - name: Build NSIS installer
        run: bun run desktop:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amanda-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
